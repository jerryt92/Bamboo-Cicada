<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Audio and haptic latency path</title>
  <desc id="desc">A timeline showing sensor input, SwiftUI frame update, async audio queue, haptic triggering, and bounded per-frame pulse scheduling.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#304f5b"/>
    </marker>
    <style>
      .bg{fill:#f7f3ea}.axis{stroke:#7b857d;stroke-width:3}.tick{stroke:#7b857d;stroke-width:2}.lane{fill:#fffdf7;stroke:#d0c2a8;stroke-width:2}.audio{fill:#eaf4f6;stroke:#6fa8b6;stroke-width:2}.haptic{fill:#fff1e8;stroke:#d58a55;stroke-width:2}.line{stroke:#304f5b;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#7d8f8a;stroke-width:3;stroke-dasharray:8 8;fill:none}.title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#26332f}.label{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#27342f}.sub{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#53615c}.tiny{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5e685f}
    </style>
  </defs>
  <rect class="bg" width="1120" height="560"/>
  <text class="title" x="54" y="54">延时路径 / Latency path</text>
  <line class="axis" x1="120" y1="104" x2="1030" y2="104" marker-end="url(#arrow)"/>
  <text class="tiny" x="118" y="86">t</text>
  <text class="tiny" x="1010" y="86">t + frame</text>
  <g>
    <line class="tick" x1="210" y1="92" x2="210" y2="116"/>
    <line class="tick" x1="420" y1="92" x2="420" y2="116"/>
    <line class="tick" x1="640" y1="92" x2="640" y2="116"/>
    <line class="tick" x1="850" y1="92" x2="850" y2="116"/>
  </g>
  <rect class="lane" x="80" y="152" width="230" height="74" rx="8"/>
  <text class="label" x="104" y="184">传感器采样</text>
  <text class="sub" x="104" y="207">Core Motion sample</text>
  <path class="line" d="M310 189H374"/>
  <rect class="lane" x="384" y="152" width="230" height="74" rx="8"/>
  <text class="label" x="408" y="184">SwiftUI 帧回调</text>
  <text class="sub" x="408" y="207">frame callback</text>
  <path class="line" d="M614 189H678"/>
  <rect class="lane" x="688" y="152" width="230" height="74" rx="8"/>
  <text class="label" x="712" y="184">位置绘制</text>
  <text class="sub" x="712" y="207">render position</text>
  <path class="dash" d="M500 226V294"/>
  <rect class="audio" x="222" y="306" width="290" height="82" rx="8"/>
  <text class="label" x="246" y="338">音频队列</text>
  <text class="sub" x="246" y="361">prewarm + play off frame path</text>
  <path class="line" d="M512 347H636"/>
  <rect class="audio" x="648" y="306" width="250" height="82" rx="8"/>
  <text class="label" x="672" y="338">最多 N 次脉冲</text>
  <text class="sub" x="672" y="361">maximumAudioPulsesPerFrame</text>
  <path class="dash" d="M638 226V430"/>
  <rect class="haptic" x="222" y="430" width="290" height="82" rx="8"/>
  <text class="label" x="246" y="462">触感门限</text>
  <text class="sub" x="246" y="485">minimum interval + intensity map</text>
  <path class="line" d="M512 471H636"/>
  <rect class="haptic" x="648" y="430" width="250" height="82" rx="8"/>
  <text class="label" x="672" y="462">摩擦反馈</text>
  <text class="sub" x="672" y="485">friction phase pulses</text>
  <text class="sub" x="78" y="270">关键点：物理积分和绘制留在帧路径；音频调度移到队列，触感按最小间隔节流。</text>
  <text class="sub" x="78" y="292">Key: physics and drawing stay in the frame path; audio scheduling moves to a queue; haptics are throttled.</text>
</svg>
